[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuepoint"
version = "0.1.11"
description = "What to play next, and exactly where to bring it in. Reads a rekordbox collection, read-only."
readme = "README.md"
authors = [{ name = "Ena Otuokon", email = "otuokonhelena@gmail.com" }]
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["dj", "rekordbox", "mixing", "harmonic-mixing", "music"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

# Deliberately small. Everything else -- the ANLZ parser, the beat grid work,
# the spectral features -- is a few dozen lines of numpy in this package.
# imageio-ffmpeg carries a working ffmpeg build, so `pip install cuepoint` is
# the whole install -- the intended user is a DJ, not someone who wants to be
# told to go and build a codec first. A system ffmpeg is still preferred when
# one is present; see audio._find_ffmpeg.
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "imageio-ffmpeg>=0.4.9",
]

[project.urls]
Homepage = "https://github.com/helena-byte999/cuepoint"
Source = "https://github.com/helena-byte999/cuepoint"
Issues = "https://github.com/helena-byte999/cuepoint/issues"

[project.scripts]
cuepoint = "cuepoint.__main__:main"

[tool.setuptools]
packages = ["cuepoint"]

[tool.setuptools.package-data]
# The web UI and its self-hosted typefaces ship inside the wheel, so the tool
# works with no network at all.
cuepoint = ["static/*.html", "static/fonts/*"]
